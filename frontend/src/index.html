<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Percy Jackson RAG Chatbot</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0a0e1a;
      color: #e8eaf0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      max-width: 780px;
      padding: 1.2rem 1.5rem 0.8rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #7ec8e3;
      letter-spacing: 0.02em;
    }

    header h1 span { color: #e36c4b; }

    #character-select {
      margin-left: auto;
      background: #1a2035;
      color: #e8eaf0;
      border: 1px solid #2e3a55;
      border-radius: 8px;
      padding: 0.4rem 0.8rem;
      font-size: 0.9rem;
      cursor: pointer;
      outline: none;
    }

    #chat-window {
      width: 100%;
      max-width: 780px;
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      scroll-behavior: smooth;
    }

    .bubble {
      max-width: 75%;
      padding: 0.75rem 1rem;
      border-radius: 14px;
      line-height: 1.55;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .bubble.user {
      align-self: flex-end;
      background: #1e3a5f;
      border-bottom-right-radius: 4px;
    }

    .bubble.assistant {
      align-self: flex-start;
      background: #1a2035;
      border-bottom-left-radius: 4px;
      border-left: 3px solid #7ec8e3;
    }

    .bubble.assistant .character-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: #7ec8e3;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.4rem;
    }

    .sources {
      font-size: 0.72rem;
      color: #6b7c9e;
      margin-top: 0.6rem;
      padding-top: 0.4rem;
      border-top: 1px solid #2e3a55;
    }

    .bubble.error {
      align-self: flex-start;
      background: #3a1a1a;
      border-left: 3px solid #e36c4b;
      color: #f08070;
    }

    .typing {
      align-self: flex-start;
      background: #1a2035;
      border-left: 3px solid #7ec8e3;
      border-radius: 14px;
      border-bottom-left-radius: 4px;
      padding: 0.75rem 1rem;
      color: #6b7c9e;
      font-style: italic;
      font-size: 0.9rem;
    }

    #input-bar {
      width: 100%;
      max-width: 780px;
      padding: 0.8rem 1.5rem 1.2rem;
      display: flex;
      gap: 0.6rem;
    }

    #user-input {
      flex: 1;
      background: #1a2035;
      color: #e8eaf0;
      border: 1px solid #2e3a55;
      border-radius: 10px;
      padding: 0.65rem 1rem;
      font-size: 0.95rem;
      outline: none;
      resize: none;
      line-height: 1.5;
      max-height: 140px;
      overflow-y: auto;
    }

    #user-input:focus { border-color: #7ec8e3; }

    #send-btn {
      background: #7ec8e3;
      color: #0a0e1a;
      border: none;
      border-radius: 10px;
      padding: 0 1.2rem;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }

    #send-btn:hover { background: #a8d8ea; }
    #send-btn:disabled { background: #2e3a55; color: #6b7c9e; cursor: not-allowed; }
  </style>
</head>
<body>

<header>
  <h1>Percy Jackson <span>RAG</span> Chat</h1>
  <select id="character-select">
    <option value="percy">Percy Jackson</option>
    <option value="annabeth">Annabeth Chase</option>
    <option value="grover">Grover Underwood</option>
    <option value="nico">Nico di Angelo</option>
    <option value="tyson">Tyson</option>
  </select>
</header>

<div id="chat-window"></div>

<div id="input-bar">
  <textarea id="user-input" rows="1" placeholder="Ask about Camp Half-Blood, quests, gods…"></textarea>
  <button id="send-btn">Send</button>
</div>

<script>
  const API_BASE = "http://localhost:8000";
  const chatWindow = document.getElementById("chat-window");
  const input = document.getElementById("user-input");
  const sendBtn = document.getElementById("send-btn");
  const characterSelect = document.getElementById("character-select");

  let history = [];

  const CHARACTER_LABELS = {
    percy: "Percy Jackson",
    annabeth: "Annabeth Chase",
    grover: "Grover Underwood",
    nico: "Nico di Angelo",
    tyson: "Tyson",
  };

  // Auto-resize textarea
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
  });

  // Send on Enter (Shift+Enter for newline)
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener("click", sendMessage);

  function appendBubble(role, text, character, sources) {
    const div = document.createElement("div");
    div.className = `bubble ${role}`;

    if (role === "assistant") {
      const label = document.createElement("div");
      label.className = "character-label";
      label.textContent = CHARACTER_LABELS[character] ?? character;
      div.appendChild(label);
    }

    const body = document.createElement("div");
    body.textContent = text;
    div.appendChild(body);

    if (sources && sources.length) {
      const src = document.createElement("div");
      src.className = "sources";
      src.textContent = "Sources: " + sources.map(s => s.source.replace(/_/g, " ")).join(", ");
      div.appendChild(src);
    }

    chatWindow.appendChild(div);
    chatWindow.scrollTop = chatWindow.scrollHeight;
    return div;
  }

  function appendTyping() {
    const div = document.createElement("div");
    div.className = "typing";
    div.textContent = "…";
    chatWindow.appendChild(div);
    chatWindow.scrollTop = chatWindow.scrollHeight;
    return div;
  }

  function appendError(msg) {
    const div = document.createElement("div");
    div.className = "bubble error";
    div.textContent = "Error: " + msg;
    chatWindow.appendChild(div);
    chatWindow.scrollTop = chatWindow.scrollHeight;
  }

  // Clear history when character changes
  characterSelect.addEventListener("change", () => {
    history = [];
    chatWindow.innerHTML = "";
  });

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    input.value = "";
    input.style.height = "auto";
    sendBtn.disabled = true;

    appendBubble("user", text);

    const typing = appendTyping();

    try {
      const res = await fetch(`${API_BASE}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          message: text,
          character: characterSelect.value,
          history,
        }),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: res.statusText }));
        throw new Error(err.detail ?? res.statusText);
      }

      const data = await res.json();
      typing.remove();

      appendBubble("assistant", data.reply, data.character, data.sources);

      history.push({ role: "user", content: text });
      history.push({ role: "assistant", content: data.reply });

      // Keep history window manageable
      if (history.length > 20) history = history.slice(-20);

    } catch (err) {
      typing.remove();
      appendError(err.message);
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }
</script>
</body>
</html>
